# Tooling configuration only — runtime dependencies live in requirements.txt.
[project]
name = "video-describer"
version = "0.4.0"
description = "Exact, timestamped video descriptions from a local vision-language model"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
